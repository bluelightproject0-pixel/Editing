    se aleja y revela el collage completo'
  redraws: []
  inventory:
  - la palabra 'fresas' (la dice 4 veces; fresa = fresa la fruta)
  - 'letreros del súper detrás: FRESCURA, QUESOS, CARNES'
  - su mamá 'del rancho' que cocina increíble
  - 'etiquetas reales del queso empaquetado: $239 $230 $276 $255 $236 $222 $235 $359, que dicen ''PRECIO BAJO'''
  - la barra de salchichonería con el personal de blanco, en el mismo cuadro que el queso empaquetado (36.0 s)
  - '''jamón o queso'''
  - '''mil pesos extra, dos mil pesos extra'''
  - '''libros que me van a ayudar a hacer más dinero'''
  - '''Claude, ChatGPT, Gemini o Grok'''
  - '''oye bro, tú puedes conseguir estas cosas más baratas aquí'''
  - sus 'gems'
  - su suéter guinda (casa con el rojo de su tablero)
  idea: En este video, la palabra 'fresa' (y cada truco que dice) se vuelve un recorte de papel que se pega en su propio tablero de inspiración,
    que crece hasta revelarse completo al final
  live_thing: la fresa recortada del gancho regresa al final y se tacha con marcador rojo justo cuando dice 'que no son para nada fresas'
